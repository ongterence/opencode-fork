name: Fork update build

# Merges upstream dev into the fork's main, builds the Windows installer with
# the fork's update feed (this repo), and publishes it as a GitHub release so
# electron-updater in installed fork builds can self-update.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Git identity
        run: |
          git config user.name "fork-update-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        shell: bash
        run: |
          set -e
          git remote add upstream https://github.com/anomalyco/opencode.git 2>/dev/null || true
          git fetch upstream dev
          BEHIND=$(git rev-list --count main..refs/remotes/upstream/dev)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "main is $BEHIND commits behind upstream/dev"
          if [ "$BEHIND" -gt 0 ]; then
            git merge refs/remotes/upstream/dev --no-edit
            git push origin main
          fi

      - name: Version
        if: steps.sync.outputs.behind != '0'
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./packages/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # electron-builder fails publishing into an existing release; the fork may
      # rebuild the same upstream version several times between official bumps.
      - name: Replace same-version release
        if: steps.sync.outputs.behind != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Install dependencies
        if: steps.sync.outputs.behind != '0'
        run: bun install

      - name: Prepare
        if: steps.sync.outputs.behind != '0'
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Build
        if: steps.sync.outputs.behind != '0'
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      - name: Package + publish release
        if: steps.sync.outputs.behind != '0'
        run: npx electron-builder --win --publish always --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_PUBLISH_OWNER: ${{ github.repository_owner }}
          OPENCODE_PUBLISH_REPO: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Fork update build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Known-good ref to rebuild as a newer rollback release"
        required: true
        type: string
      reason:
        description: "Reason for promoting this known-good source"
        required: true
        type: string

concurrency:
  group: fork-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.source.outputs.publish }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      reason: ${{ steps.source.outputs.reason }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}

      - name: Git identity
        run: |
          git config user.name "fork-update-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Resolve source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            git remote add upstream https://github.com/anomalyco/opencode.git 2>/dev/null || true
            git fetch upstream dev
            behind=$(git rev-list --count HEAD..refs/remotes/upstream/dev)
            if [ "$behind" = "0" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "No upstream commits to promote"
              exit 0
            fi
            git merge refs/remotes/upstream/dev --no-edit
            git push origin HEAD:main
            source_ref="upstream/dev"
            reason="Scheduled upstream synchronization"
          else
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Rollback source must be an immutable commit in origin/main history" >&2
              exit 1
            fi
            source_ref="$INPUT_SOURCE_REF"
            reason="$INPUT_REASON"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "source_ref<<SOURCE_REF_EOF"
            echo "$source_ref"
            echo "SOURCE_REF_EOF"
            echo "reason<<REASON_EOF"
            echo "$reason"
            echo "REASON_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Derive immutable fork version
        if: steps.source.outputs.publish == 'true'
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin main
            upstream=$(git show origin/main:packages/desktop/package.json | node -e "let source = ''; process.stdin.on('data', (chunk) => source += chunk); process.stdin.on('end', () => console.log(JSON.parse(source).version))")
          else
            upstream=$(node -p "require('./packages/desktop/package.json').version")
          fi
          if ! [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream desktop version is not major.minor.patch: $upstream" >&2
            exit 1
          fi
          latest=$(git ls-remote --tags origin "refs/tags/v*-fork.*" | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-fork\.[1-9][0-9]*$' | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            latest_base=${latest%%-fork.*}
            upstream=$(printf '%s\n%s\n' "$upstream" "$latest_base" | sort -V | tail -1)
          fi
          version="${upstream}-fork.${GITHUB_RUN_NUMBER}"
          if [ -n "$latest" ] && { [ "$version" = "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; }; then
            echo "Derived version $version is not newer than existing fork release $latest" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag ${tag}" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${tag}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared immutable release $tag"

  validate:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.source.outputs.source_sha }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare fork package
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.source.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Validate source and package
        working-directory: packages/desktop
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          bun test src/main/updater-controller.test.ts src/main/updater.test.ts
          bun typecheck
          bun run build
          npx electron-builder --win --publish never --config electron-builder.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          OPENCODE_FORK_UPDATE: "true"
          OPENCODE_FORK_PACKAGE_STAGE: unsigned
          OPENCODE_PUBLISH_OWNER: ${{ github.repository_owner }}
          OPENCODE_PUBLISH_REPO: ${{ github.event.repository.name }}

      - name: Verify unsigned package and update metadata
        shell: pwsh
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          $installers = @(Get-ChildItem "packages/desktop/dist/*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Unsigned staging artifact has unexpected signature status: $($signature.Status)"
          }

          $appUpdatePath = "packages/desktop/dist/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $appUpdatePath)) {
            throw "Packaged app-update.yml was not produced"
          }

          $metadataPath = "packages/desktop/dist/latest.yml"
          if (-not (Test-Path $metadataPath)) {
            throw "latest.yml was not produced"
          }
          $lines = Get-Content $metadataPath
          $urlIndex = [Array]::FindIndex($lines, [Predicate[string]] { param($line) $line.Trim() -eq "- url: $($installer.Name)" })
          if ($urlIndex -lt 0) {
            throw "latest.yml does not name $($installer.Name)"
          }
          if ($lines[0].Trim() -ne "version: $env:VERSION") {
            throw "latest.yml version does not match the immutable release version"
          }
          $shaLine = $lines[($urlIndex + 1)..([Math]::Min($urlIndex + 4, $lines.Count - 1))] |
            Where-Object { $_.Trim().StartsWith("sha512:") } |
            Select-Object -First 1
          if (-not $shaLine) {
            throw "latest.yml has no SHA-512 for $($installer.Name)"
          }
          $expected = $shaLine.Trim().Substring("sha512:".Length).Trim()
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          try {
            $actual = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($installer.FullName)))
          }
          finally {
            $sha512.Dispose()
          }
          if ($actual -ne $expected) {
            throw "latest.yml SHA-512 does not match $($installer.Name)"
          }

          "$(Get-FileHash $installer.FullName -Algorithm SHA512 | Select-Object -ExpandProperty Hash)  $($installer.Name)" |
            Set-Content "packages/desktop/dist/UNSIGNED-SHA512SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-update-unsigned-${{ needs.source.outputs.version }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/latest.yml
            packages/desktop/dist/UNSIGNED-SHA512SUMS.txt

  promote:
    needs:
      - source
      - validate
    if: needs.source.outputs.publish == 'true'
    runs-on: windows-latest
    environment: fork-update-production
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-update-unsigned-${{ needs.source.outputs.version }}
          path: release-assets

      - name: Promote immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE_REF: ${{ needs.source.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          REASON: ${{ needs.source.outputs.reason }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(Get-ChildItem "release-assets" -File)
          $installers = @($assets | Where-Object { $_.Extension -eq ".exe" })
          if ($assets.Count -ne 3 -or $installers.Count -ne 1) {
            throw "Unsigned release artifact has an unexpected file set"
          }
          $installer = $installers[0]
          $manifest = (Get-Content "release-assets/UNSIGNED-SHA512SUMS.txt" -Raw).Trim().Split("  ", 2)
          $installerHash = Get-FileHash $installer.FullName -Algorithm SHA512 | Select-Object -ExpandProperty Hash
          if ($manifest.Count -ne 2 -or $manifest[1] -ne $installer.Name -or $manifest[0] -ne $installerHash) {
            throw "Unsigned artifact manifest does not match the installer"
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Promoted installer has an unexpected signature status: $($signature.Status)"
          }
          $metadata = Get-Content "release-assets/latest.yml"
          if ($metadata[0].Trim() -ne "version: $env:VERSION") {
            throw "Promoted update metadata has the wrong version"
          }
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          try {
            $metadataHash = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($installer.FullName)))
          }
          finally {
            $sha512.Dispose()
          }
          $metadataHashes = @($metadata | Where-Object { $_.Trim().StartsWith("sha512:") })
          if ($metadataHashes.Count -ne 2 -or @($metadataHashes | Where-Object { $_.Trim() -ne "sha512: $metadataHash" }).Count -ne 0) {
            throw "Promoted latest.yml SHA-512 does not match the unsigned installer"
          }

          $existingTag = git ls-remote --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect remote tag $tag"
          }
          if ($existingTag) {
            throw "Refusing to reuse existing tag $tag"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Refusing to overwrite existing release $tag"
          }

          $notes = @"
          Source ref: $env:SOURCE_REF
          Source commit: $env:SOURCE_SHA
          Reason: $env:REASON

          This immutable Windows fork release passed updater tests, type checking, build, unsigned-artifact hash verification, and latest.yml SHA-512 verification before promotion.
          "@
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.md"
          $releasePaths = @($assets | Select-Object -ExpandProperty FullName)

          gh release create $tag @releasePaths `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "OpenCode $env:VERSION" `
            --notes-file "$env:RUNNER_TEMP/release-notes.md" `
            --draft
          if ($LASTEXITCODE -ne 0) {
            throw "Draft release creation failed"
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Protected release promotion failed; the draft remains invisible to update clients"
          }
